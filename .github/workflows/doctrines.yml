name: doctrines
"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the doctrine enforcer with local stores
        run: python3 -B scripts/ci_env.py -- bash scripts/check_doctrines.sh
