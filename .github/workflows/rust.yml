name: rust
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  # One owned cluster per job; test helpers refuse a caller-supplied database.
  pg-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Provision local compiler stores and run disposable PostgreSQL proofs
        run: |
          python3 -B - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          sys.path.insert(0, "scripts")
          from project_env import ROOT, STORES, local_directory

          os.umask(0o077)
          environment = dict(os.environ)
          for name, relative in STORES.items():
              environment[name] = str(local_directory(ROOT, relative))
          environment["RUSTUP_HOME"] = str(local_directory(ROOT, ".project-data/installed-toolchains"))
          environment["PYTHONDONTWRITEBYTECODE"] = "1"
          with (ROOT / "rust-toolchain.toml").open("rb") as source:
              pin = tomllib.load(source)["toolchain"]["channel"]
          # The image's rustup and PostgreSQL binaries are read-only inputs.
          # Compiler installation, downloads and scratch stay on the repo volume.
          subprocess.run([
              "rustup", "toolchain", "install", pin, "--profile", "minimal",
              "--component", "rustfmt", "--component", "clippy", "--no-self-update",
          ], cwd=ROOT, env=environment, check=True)
          pg = subprocess.run(["pg_config", "--bindir"], cwd=ROOT, env=environment,
                              capture_output=True, text=True, check=True)
          environment["PG_BIN"] = str(Path(pg.stdout.strip()).resolve(strict=True))
          os.chdir(ROOT)
          os.execvpe("bash", ["bash", "scripts/run_pg_tests.sh"], environment)
          PYTHON
