name: rust
"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check workspace with local compiler and stores
        run: |
          python3 -B scripts/ci_env.py --rust -- bash -euo pipefail <<'CHECKS'
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo build --workspace --bins --locked
          test -x target/debug/reasonbraid-extract
          test -x target/debug/reasonbraid-browse
          python3 -B scripts/ci_browser.py -- cargo test --all --locked -- --nocapture
          CHECKS
      - name: Retain browser setup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-setup
          path: |
            target/ci-browser/*/browser.json
            target/ci-browser/*/version.log
          if-no-files-found: ignore

      # The harness writes stdout.log, stderr.log and worker.json per fixture,
      # and the production worker keeps its own receipts under .project-data.
      # Retain the whole tree rather than named files: the first attempt globbed
      # filenames taken from the book's description of the PRODUCTION worker and
      # missed the harness's actual `stderr.log`, so a run returned byte COUNTS
      # and no bytes. The fixtures are a few hundred bytes each.
      - name: Retain browser worker evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-worker-evidence
          path: |
            target/browser-lifetime-controls/**
            .project-data/browser/**
          # .project-data is a DOT-directory and upload-artifact excludes hidden
          # files by default, which is why the previous attempt returned the
          # harness receipts and not the browser's own stderr.
          include-hidden-files: true
          if-no-files-found: ignore

  pg-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python controls and full owned PostgreSQL collection
        run: |
          python3 -B scripts/ci_env.py --rust -- bash -euo pipefail <<'CHECKS'
          export PG_BIN="$(pg_config --bindir)"
          python3 -B -c 'import os,sys; sys.path.insert(0,"scripts"); import run_pg_tests as r; r.pg_tools(dict(os.environ))'
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
          bash scripts/run_pg_tests.sh --demo
          CHECKS

  book:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build book with a pinned local renderer
        run: |
          python3 -B scripts/ci_env.py --rust -- bash -euo pipefail <<'CHECKS'
          cargo install mdbook --version 0.5.4 --locked --root .project-data/cargo --target-dir target/ci-mdbook-build
          test "$(.project-data/cargo/bin/mdbook --version)" = "mdbook v0.5.4"
          .project-data/cargo/bin/mdbook build docs/book
          CHECKS
