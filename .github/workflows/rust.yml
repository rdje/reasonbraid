name: rust
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all

  # PostgreSQL-backed integration tests (WP2/WP3/WP5): the atomic
  # state/event/idempotency/outbox transaction (.2.1), the leased outbox worker with
  # fencing + kill points (.2.2), the node channel with cursor resume + reconciliation
  # handshake (.3.2), and the authority engine with the enrollment-boundary ceiling +
  # audit records (.5.1) can only be proven against a live Postgres. Mirrors the local
  # `scripts/run_pg_tests.sh` ephemeral server.
  pg-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reasonbraid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/reasonbraid_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (PostgreSQL atomic transaction + outbox worker + node channel + authority + budget)
        run: cargo test -p reasonbraid-server --test atomic_transaction --test outbox_worker --test node_channel --test authority --test budget -- --nocapture
