name: supply-chain
# Dependency/advisory/license + secret-scan skeleton (PHASE-0.0.7, backlog 8).
# Runs alongside the bedrock `rust` (fmt/clippy/test) and `doctrines` (gate) workflows.
# NOT a release pipeline: no SBOM, provenance, or release-signing here — those are the
# G9 / §16.12 gates, deferred until a release exists.
on:
  push:
  pull_request:

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny against deny.toml
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so committed-but-later-removed secrets are still caught.
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.30.1" # bump on a schedule; pinned so a drift never silently changes the scan
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xzf - gitleaks
          ./gitleaks version
      - name: Run gitleaks
        run: ./gitleaks detect --source . --redact --verbose
