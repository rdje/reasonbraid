name: supply-chain
# Checks only; release SBOM, provenance and signing remain G9 requirements.
"on":
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run pinned cargo-deny with local compiler and stores
        run: python3 -B scripts/ci_env.py --rust -- python3 -B scripts/ci_scanners.py cargo-deny
      - name: Retain scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        env:
          TMPDIR: ${{ github.workspace }}/.project-data/tmp
          TMP: ${{ github.workspace }}/.project-data/tmp
          TEMP: ${{ github.workspace }}/.project-data/tmp
        with:
          name: cargo-deny-evidence
          if-no-files-found: warn
          path: |
            target/ci-scanners/**/scanner.json
            target/ci-scanners/**/version.log
            target/ci-scanners/**/check.log

  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned Gitleaks over history with full redaction
        run: python3 -B scripts/ci_env.py -- python3 -B scripts/ci_scanners.py gitleaks
      - name: Retain redacted scanner evidence
        if: always()
        uses: actions/upload-artifact@v4
        env:
          TMPDIR: ${{ github.workspace }}/.project-data/tmp
          TMP: ${{ github.workspace }}/.project-data/tmp
          TEMP: ${{ github.workspace }}/.project-data/tmp
        with:
          name: gitleaks-evidence
          if-no-files-found: warn
          path: |
            target/ci-scanners/**/scanner.json
            target/ci-scanners/**/version.log
            target/ci-scanners/**/check.log
            target/ci-scanners/**/gitleaks.json
