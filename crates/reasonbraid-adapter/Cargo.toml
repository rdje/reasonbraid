# reasonbraid-adapter — the harness adapter boundary (KICKOFF.md §3): the narrow
# vendor-neutral contract, the deterministic fake adapter (the conformance oracle),
# and the sanitized outcome fixture corpus. WP4 (.4.1) lands the contract + fake;
# the first real harness qualifies behind the same contract in .4.2.
[package]
name = "reasonbraid-adapter"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Deadlines and timestamps on the run contract (caller-supplied, like the rest of
# the stack); serde so RunRequest's deadline round-trips in fixtures.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reasonbraid-core = { path = "../reasonbraid-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The WP7 benchmark hashes its versioned corpus/prompt files so a report can prove
# which inputs produced it (re-derive, never trust a copy).
sha2 = "0.10"
# The WP7 graders parse REQUIRED confidence/citation shapes from untrusted answer
# text with fixed patterns — no backtracking hazards, deterministic scoring.
regex = "1"
# The rb-bench binary's argument surface (the WP7 runner).
clap = { version = "4", features = ["derive"] }
# The fake adapter's per-operation state + cancellation Notify, and the Codex
# adapter's child-process supervision (io-util for line reading, process for the
# child, rt for the stderr-drain task). The contract itself is runtime-free;
# macros + rt-multi-thread serve the rb-bench binary's async main.
tokio = { version = "1", features = ["sync", "io-util", "process", "rt", "macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
