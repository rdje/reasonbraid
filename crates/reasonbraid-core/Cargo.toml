# reasonbraid-core — the domain-model crate (KICKOFF.md §3): strong identifiers now,
# command/event envelopes and minimal thread/provider-attempt state in later WP1 leaves.
[package]
name = "reasonbraid-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7"] }
