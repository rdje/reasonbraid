# reasonbraid-core — the domain-model crate (KICKOFF.md §3): strong identifiers now,
# command/event envelopes and minimal thread/provider-attempt state in later WP1 leaves.
[package]
name = "reasonbraid-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Authority validity windows (PHASE-0.5.1): boundary/grant valid_from/expires_at and
# decision timestamps. Same minimal feature set as the other crates.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
# SHA-256 for the authorization policy digest (PHASE-0.5.1): the audit record names
# the exact policy inputs + decision it was evaluated against. Permissive-licensed
# (MIT/Apache-2.0, RustCrypto).
sha2 = "0.10"
# v7 = sortable identifiers; v5 = the deterministic dev-profile actor handle
# (PHASE-0.6.1: UUIDv5 namespacing over the presented principal, not a security
# boundary — the dev profile trusts the presented principal anyway).
uuid = { version = "1", features = ["v7", "v5"] }
