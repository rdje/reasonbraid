# reasonbraid-node — the Rust node crate (KICKOFF.md §3): outbound connection, SQLite
# journal, execution supervisor. PHASE-0.3.1 lands the WAL journal + the read-only
# inspection CLI (`rb-journal`); .3.2 lands the outbound channel (client side) and the
# reconciliation gate; the execution supervisor follows in WP4.
[package]
name = "reasonbraid-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "rb-journal"
path = "src/bin/rb-journal.rs"

[dependencies]
# Caller-supplied clock for journal timestamps (same pattern as the server's outbox
# worker): every write records the caller's `now` as RFC 3339 TEXT, so tests advance
# time deterministically and the journal never depends on host/DB clock agreement.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The inspection CLI's argument surface. default-features=false trims color/suggestions
# (a node-local operator tool, not an interactive surface).
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
reasonbraid-core = { path = "../reasonbraid-core", version = "0.1.0" }
# The adapter contract the execution supervisor drives (PHASE-0.4.1); the fake adapter
# in the same crate is the conformance oracle the supervisor tests replay.
reasonbraid-adapter = { path = "../reasonbraid-adapter", version = "0.1.0" }
# The outbound channel's HTTP client (PHASE-0.3.2): plain HTTP/1 JSON for the loopback
# dev profile — no TLS features yet (the `.1.2.2` key-proof rides the dev secret; the
# mTLS streaming profile is ADR-006/ADR-007, Phase 2).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `.1.2.2` handshake: the node signs the canonical coverage with its
# workload certificate's key (rcgen, the server-issued leaf's format) and
# parses the leaf's validity window for the rotate-before-expiry trigger
# (x509-parser). The cert/key DER files live beside the journal.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls-pki-types = "1"
x509-parser = "0.18"
# sqlite: the embedded node journal (§11.4). Same driver stack as the server's Postgres
# side; the bundled SQLite keeps the build hermetic (no system library dependency).
# migrate: `sqlx::migrate!` embeds `migrations/` in the binary — the journal schema
# ships with the node, not with the control plane.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# Local operation identifiers (`op_<uuidv7>`): node-local identity for now — promoted
# to a `reasonbraid-core` Id family the moment an operation crosses the wire.
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
