[package]
name = "reasonbraid-policy-compiler"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The deterministic policy-projection compiler (ADR-033): a hermetic pure function from the resolved clause set to the target bundles — byte-identical output, declared unrepresentables, never a silent omission."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true
