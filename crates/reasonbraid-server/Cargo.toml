# reasonbraid-server — the control-plane crate (KICKOFF.md §3): HTTP/SSE, command handlers,
# PostgreSQL transactions. WP2 (.2.1) lands the atomic state/event/idempotency/outbox
# transaction; .2.2 lands the leased outbox worker with fencing; .3.2 lands the node
# channel's server side (the durable per-node inbox, replay, and reconciliation handshake).
[package]
name = "reasonbraid-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The domain authority types the .5.1 engine evaluates and persists (boundary ceiling,
# grants, decisions, the policy digest). The first direct core dependency of the server.
reasonbraid-core = { path = "../reasonbraid-core", version = "0.1.0" }
# The workload-identity CA (PHASE-2.1.2.1, ADR-007): the project-local issuer the
# enrollment path signs node leaves with. DER only (no `pem` feature — the bans
# doctrine's base64-split fix from the .1.1 spike stays).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "x509-parser"] }
# The DER key type rcgen's from_der_and_sign_algo takes (same family as rustls).
rustls-pki-types = "1"
# rcgen's validity-window type (OffsetDateTime) — the same `time` family it links.
time = "0.3"
# The node channel's HTTP surface (ROADMAP.md §9.3): JSON over HTTP/1 for Phase 0 — the
# authenticated streaming profile is a later phase (WP5 identity, ADR-006's formal record).
axum = "0.8"
# Minimal chrono for the outbox worker's caller-supplied lease clock (`chrono::DateTime<Utc>`
# binds to TIMESTAMPTZ via sqlx's `chrono` feature). default-features=false keeps it small.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The rb-server binary's argument surface (.6.1); `env` lets --database-url read
# $DATABASE_URL.
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The control API's idempotency request hash (.6.1): SHA-256 over operation +
# principal + canonical body (same crate family as core's policy digest).
sha2 = "0.10"
# The .1.2.2 handshake key-proof: HMAC-SHA256 over the channel fields with the
# node's dev secret (the .1.2.1 node_keys row); `verify_slice` is constant-time.
hmac = "0.12"
# tls-none: local/CI Postgres is reached over a plaintext socket (sslmode=disable), so no
# TLS backend is pulled in — which also keeps the dependency tree (and its license surface)
# small for the supply-chain gate.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "tls-none",
    "migrate",
    "macros", # for `sqlx::migrate!` (runtime-applied; we still use the runtime query API)
    "json",
    "chrono", # TIMESTAMPTZ <-> chrono DateTime<Utc> for the worker lease clock
] }
# The rb-server binary's runtime (.6.1): multi-threaded tokio + shutdown signals.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
# The node channel integration tests drive BOTH sides over real localhost sockets: the
# axum server here and the node client from reasonbraid-node (reqwest: the wire-forging
# tests need a raw HTTP client; plain http, no TLS features).
reasonbraid-node = { path = "../reasonbraid-node", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
