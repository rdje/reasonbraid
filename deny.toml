# deny.toml — cargo-deny policy for the ReasonBraid workspace.
#
# A DEPENDENCY / ADVISORY / LICENSE policy skeleton (ROADMAP.md §16.10, backlog 8,
# KICKOFF.md §3). It is NOT a release artifact and carries NO public-release claim:
# SBOM generation, signed provenance, and release-signing are the G9 / §16.12 gates,
# deferred until there is something to release.
#
# Section and field names target cargo-deny 0.20. The workspace has real direct and
# transitive dependencies; evaluate the current locked graph and fresh advisory data
# at each dependency checkpoint. Review the scoped duplicate/license exceptions below
# when their graph or security assumptions change; they are not future blanket approval.
#
# Severity vocabulary: "deny" = fail the check, "warn" = report only, "allow" = ignore.

[graph]
# Platform targets the dependency graph is resolved for. Linux = the server host and CI;
# macOS = the development host. Windows is not a Phase 0 target.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories for direct and transitive dependencies. (cargo-deny 0.20: `unmaintained`
# and `unsound` are scope selectors — which crates get checked — not lint levels.)
unmaintained = "all"    # check workspace + transitive crates for the `unmaintained` class
unsound = "all"         # check every crate for the `unsound` class
ignore = []

[bans]
multiple-versions = "deny"  # two versions of one crate hide a split decision — force a choice
wildcards = "deny"          # wildcard version reqs are a reproducibility/supply-chain hazard
deny = []
# Reviewed duplicates from the sqlx/tokio tree (2026-09-06): each is two majors of a
# low-level or proc-macro crate that coexist without crossing an abstraction/security
# boundary. Re-review if a THIRD version appears or one of them gains a security advisory.
skip = [
    { name = "getrandom" }, # 0.2 (via rand 0.8) vs 0.4 (via uuid v7)
    { name = "hashbrown" }, # 0.15 vs 0.17 (indexmap/ahash majors)
    { name = "syn" },       # 2.x vs 3.x (proc-macro derive majors)
    # The R2/R3 pack crates (2026-09-07, the .7.2 supply-chain re-run):
    # each pair is a low-level crate whose two majors coexist inside ONE
    # third-party's tree without crossing a boundary — re-review if a
    # THIRD version appears or one gains a security advisory.
    { name = "block-buffer" },   # 0.10 vs 0.12 — lopdf's sha2 0.11 family
    { name = "cpufeatures" },    # 0.2 vs 0.3 — the same digest-family split
    { name = "crypto-common" },  # 0.1 vs 0.2 — ditto
    { name = "digest" },         # 0.10 vs 0.11 — ditto (the trait split)
    { name = "md-5" },           # 0.10 vs 0.11 — ditto
    { name = "sha2" },           # 0.10 (the workspace's) vs 0.11 (lopdf's)
    { name = "foldhash" },       # 0.1 vs 0.2 — the hashbrown-indexmap pair
    { name = "nom" },            # 7 vs 8 — lopdf's parser upgrade
    { name = "rand" },           # 0.8/0.9 + the chromiumoxide tree's — no crossing
    { name = "rand_chacha" },    # the rand-family split
    { name = "rand_core" },      # ditto
    { name = "darling" },        # 0.20 (the derive_builder family) vs 0.24 (the rmcp-macros pin) — two proc-macro families each pin their darling, no crossing
    { name = "darling_core" },   # ditto (the darling family's internals)
    { name = "darling_macro" },  # ditto
    { name = "reqwest" },        # 0.12 (the server's) vs 0.13 (chromiumoxide's
                                 # own fetcher) — SEPARATE binaries, no types cross
]
skip-tree = []

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"   # only crates.io (and explicit allow-list below) is a known source
unknown-git = "deny"        # no unpinned git dependencies

[licenses]
# Permissive-only by construction: a license not in `allow` is not permitted (no copyleft).
confidence-threshold = 0.93  # require high confidence when a license is inferred from text
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",   # `subtle` (constant-time crypto primitive, via sqlx SCRAM auth)
    "Zlib",
]
exceptions = [
    # uluru (MPL-2.0, a file-level copyleft): lopdf's tiny arena dependency.
    # The crate is never modified (the copyleft's file scope stays inside
    # it) and no alternative exists in lopdf's tree — the narrowest
    # exception the policy's exceptions list exists for.
    { name = "uluru", allow = ["MPL-2.0"] },
]
