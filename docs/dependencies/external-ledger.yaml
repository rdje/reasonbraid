# docs/dependencies/external-ledger.yaml
#
# External dependency ledger (ROADMAP.md §7.4). One entry per protocol, SDK, CLI,
# provider, or harness the project may depend on. CI warns on expired checks; release
# gates require fresh records for every exposed compatibility profile. Prose must never
# permanently assert SDK maturity — `checked_at` is deliberately dated.
#
# Fields per entry (ROADMAP.md §7.4, plus two documented additions):
#   name, kind, owner, source_url, checked_at,
#   tested_versions, protocol_versions, license,
#   supported_features, transports, auth_modes,
#   known_semantic_losses, conformance_results,
#   security_notes, upgrade_policy, revalidation_trigger,
#   baseline
#
# Conventions:
#   - `kind` classifies the row (protocol / sdk / cli / provider / harness), per the
#     §7.4 preamble "for every protocol, SDK, CLI, provider, and harness".
#   - `checked_at` is the last date a human/tool revalidated the row against primary
#     sources. A stale `checked_at` makes the row un-trusted for release gates.
#   - `tested_versions` / `protocol_versions` are pinned only at the relevant spike
#     (PHASE-0.4) or release gate. An empty list means "not yet pinned", never "any".
#   - `license` is "unverified" until a spike records it from the package metadata —
#     never asserted from memory (docs/CLAIM_VERIFICATION.md, leg 1).
#   - `baseline` carries the dated, corrected fact this row was stubbed from
#     (ROADMAP.md §28.1, 2026-09-04), so the reasoning is recoverable without re-reading
#     the roadmap.
#   - `revalidation_trigger` names the condition that makes `checked_at` stale and
#     forces a fresh check before the next release gate.
#
# Next rows (not this leaf): PostgreSQL, NATS JetStream, and the candidate Rust
# ecosystem (Tokio, Axum, SQLx, Rusqlite, Rustls, tracing/OpenTelemetry, policy parsing)
# from ROADMAP.md §7.3 / §28.2.

schema_version: 1

entries:
  - name: "Model Context Protocol (MCP) — official Rust SDK"
    kind: "protocol + sdk"
    owner: "Model Context Protocol (modelcontextprotocol)"
    source_url: "https://github.com/modelcontextprotocol/rust-sdk"
    checked_at: "2026-09-20"   # SIGNOFF-REPAIR.6.8.2 — from primary sources, not memory
    tested_versions:
      - "rmcp 3.2.0 (Cargo.lock)"   # the exact pin; the lock resolves rmcp and rmcp-macros to 3.2.0
    protocol_versions:
      - "2025-11-25"           # SERVED. rmcp 3.2.0 defines ProtocolVersion::LATEST = V_2025_11_25
      - "2026-07-28"           # KNOWN to the SDK (a later member of KNOWN_VERSIONS), not offered
    license: "Apache-2.0"      # read from the vendored rmcp-3.2.0 and rmcp-macros-3.2.0 manifests
    supported_features:
      - "tools — six served: get_thread, list_inbox, get_policy_bundle, respond, join_call, propose_policy_change"
      - "resources — not implemented"
      - "prompts — not implemented"
      - "subscriptions/listen — consumed as a CLIENT, hand-written rather than SDK-backed"
    transports:
      - "stdio (server) — SHIPPED as `rb-mcp`; rmcp feature `transport-io`, +0 packages"
      - "Streamable HTTP (server) — BLOCKED upstream, see revalidation_trigger"
      - "Streamable HTTP (client) — BLOCKED upstream, same cause"
    auth_modes:
      - "per-tool `principal` argument — this transport carries no identity of its own"
      - "OAuth → tenant identity mapping — not implemented"
    known_semantic_losses:
      - "an MCP listen stream does not auto-resume; ReasonBraid owns the durable cursor and dedup state and discloses any upstream replay gap (ROADMAP §9.6)"
    conformance_results:
      - "no SDK-level conformance fixture exists: the listen ritual is exercised over a real socket by a hand-written client (SIGNOFF-REPAIR.6.2.4), which is NOT an SDK conformance claim"
      - "the served surface is driven end to end over the real stdio transport by crates/reasonbraid-mcp/tests/stdio_transport.rs"
    security_notes:
      - "the generated ServerHandler identifies the server as the SDK: Implementation::default() is env!(\"CARGO_CRATE_NAME\") evaluated inside rmcp, so any server that skips get_info presents itself to every client as `rmcp 3.2.0`. ReasonBraid overrides it (SIGNOFF-REPAIR.6.8)"
      - "enabling any Streamable-HTTP feature pulls base64 0.23.1 alongside the tree's 0.22.1, which deny.toml's multiple-versions = \"deny\" forbids"
    upgrade_policy: "pin a tested release + protocol profile; revalidate against the SDK changelog"
    revalidation_trigger: >-
      MCP specification or Rust SDK major/minor release; before the interop spike and
      again at each release gate that claims MCP compatibility. ALSO, and mechanically:
      when the base64 requirement split closes. Every rmcp Streamable-HTTP feature —
      client, client-reqwest and server — requires base64 ^0.23 while 11 vendored crates
      and reasonbraid-server itself require ^0.22, so neither transport can be enabled
      without weakening a supply-chain doctrine (SIGNOFF-REPAIR.6.6). Check with:
      `python3 -B scripts/census_external_ledger.py --triggers`; one base64 version means
      the block has lifted and both transports become an ordinary feature decision again.
    baseline: >-
      2026-09-04: the official Rust SDK documents a stable 3.x line supporting the MCP
      2026-07-28 specification (https://modelcontextprotocol.io/specification/2026-07-28).
      The long-lived subscriptions/listen stream has no automatic reconnect resumption, so
      ReasonBraid owns durable cursor + dedup state and discloses any upstream replay gap
      (ROADMAP.md §9.6). Roadmap §7.3 names `rmcp`; §28.1 corrects this to the official
      rust-sdk — reconcile the crate name at the spike.

  - name: "Agent2Agent Protocol (A2A) — official Rust SDK"
    kind: "protocol + sdk"
    owner: "A2A Project (a2aproject)"
    source_url: "https://github.com/a2aproject/a2a-rs"
    checked_at: "2026-09-04"   # NOT bumped: the row as a whole is un-revalidated (SIGNOFF-REPAIR.6.8.2.1)
    tested_versions:
      - "a2a-lf 0.3.0"         # SIGNOFF-REPAIR.6.8.2.1 — from Cargo.lock
    protocol_versions:
      - "v1"
    license: "Apache-2.0"      # SIGNOFF-REPAIR.6.8.2.1 — read from the vendored a2a-lf-0.3.0 manifest
    supported_features: []     # agent cards / tasks / messages / artifacts — fill at spike
    transports:                # transports the SDK describes (ROADMAP.md §28.1)
      - "json-rpc"
      - "rest"
      - "grpc"
      - "sse"
      - "protobuf"
    auth_modes: []             # fill at spike
    known_semantic_losses: []  # authority / budget / evidence / decision-rule / policy losses
    conformance_results: []    # fixtures not yet run
    security_notes: []
    upgrade_policy: >-
      pin exact tested releases and Cargo.lock; use a Git SHA only for an explicitly
      documented unreleased fix.
    revalidation_trigger: >-
      A2A spec or SDK release; before the interop spike and at each release gate that
      claims A2A compatibility.
    baseline: >-
      2026-09-04: A2A has a current v1 specification (https://a2a-protocol.org/latest/specification/)
      and an official Rust SDK that describes JSON-RPC, REST, gRPC, SSE, and protobuf support.
      Component crates are published on crates.io (e.g. a2a-lf, a2a-server-lf, a2a-client-lf);
      the CLI is published as a2a-cli. The crates remain pre-1.0, so compatibility must be
      demonstrated rather than inferred from SemVer (ROADMAP.md §9.7). A2A is an interoperability
      facade, never ReasonBraid's governance protocol.

  - name: "OpenAI Codex (Codex-family CLI)"
    kind: "cli + harness"
    owner: "OpenAI"
    source_url: "https://github.com/openai/codex"
    checked_at: "2026-09-06"   # revalidated at the PHASE-0.4.2 adapter spike (its trigger)
    tested_versions:
      - "0.153.4"              # installed on the dev host; the adapter is qualified against it
    protocol_versions: []      # the JSONL event stream is versioned by CLI release, not separately
    license: "Apache-2.0"      # verified from the primary source (openai/codex LICENSE, 2026-09-06)
    supported_features:
      - "exec --json (JSONL event stream: thread.started / item.completed / turn.completed)"
      - "per-thread thread_id (provider handle, surfaced in the stream, not the ack)"
      - "exact token usage receipts (input/cached/cache-write/output/reasoning tokens)"
      - "ephemeral runs (--ephemeral), --skip-git-repo-check, sandbox modes, --output-schema"
      - "thread resume (codex exec resume) — continuation, NOT a status lookup"
    transports:
      - "CLI subprocess; prompt as argv, JSONL on stdout, plaintext stderr"
    auth_modes:
      - "ambient user login (~/.codex); the adapter holds NO credentials"
    known_semantic_losses:
      - "no first-class status query for a past attempt (query_status -> Unsupported)"
      - "no provider idempotency-key option on exec"
      - "receipts report tokens, never cost (normalized cost stays unknown)"
      - "cancellation is kill-the-child: BestEffort, no provider proof of stopping"
    conformance_results:
      - "live qualification: RB_LIVE_CODEX=1 cargo test -p reasonbraid-node --test codex_live (1 passed, 2026-09-06)"
      - "offline supervision suite: cargo test -p reasonbraid-adapter --test codex_adapter (9 passed)"
    security_notes:
      - "run payload travels as the USER prompt only (never system config/policy, §16.6)"
      - "the child runs with --sandbox read-only and --ephemeral; no session persistence"
    upgrade_policy: >-
      revalidate the installed version and invocation mode on every CLI release;
      re-run the live qualification test before any release gate claims this adapter.
    revalidation_trigger: >-
      Codex CLI release or documented invocation-mode change; at each release gate that
      claims the Codex-family adapter.
    baseline: >-
      2026-09-04: the openai/codex repository is the primary implementation/integration
      reference for Codex-family CLI behavior (ROADMAP.md §28.1). Revalidated 2026-09-06
      at the first real adapter (PHASE-0.4.2): codex-cli 0.153.4, exec --json JSONL
      interface, Apache-2.0 — see docs/evidence/2026-09-06_codex-adapter-qualification.md.

  - name: "Claude Code CLI (Claude-family harness)"
    kind: "cli + harness"
    owner: "Anthropic"
    source_url: "https://code.claude.com/docs/en/agent-sdk/overview"
    checked_at: "2026-09-06"   # revalidated at the PHASE-1.4 adapter (its trigger)
    tested_versions:
      - "2.1.263"              # installed on the dev host; the adapter is qualified against it
    protocol_versions: []      # the stream-json event stream is versioned by CLI release
    license: "unverified"      # CLI EULA is not a package license; pin at a future spike
    supported_features:
      - "-p --output-format stream-json (JSONL: system/init, assistant, result)"
      - "--restricted removes the code-running tools + WebFetch; --tools '' disables ALL tools (content-only)"
      - "session_id in system/init — the provider handle, arriving before the first chunk"
      - "result event: exact usage (input/output/cache tokens) AND total_cost_usd (money)"
      - "--verbose is REQUIRED by the CLI with stream-json (refused pre-dispatch otherwise)"
    transports:
      - "CLI subprocess; prompt as argv AFTER --, JSONL on stdout, plaintext stderr"
    auth_modes:
      - "ambient user login; the adapter holds NO credentials"
    known_semantic_losses:
      - "no first-class status query for a past attempt (query_status -> Unsupported; --resume continues a session, it does not query)"
      - "no provider idempotency-key option on the print path"
      - "cancellation is kill-the-child: BestEffort, no provider proof of stopping"
    conformance_results:
      - "live qualification: RB_LIVE_CLAUDE=1 cargo test -p reasonbraid-node --test claude_live (1 passed, 2026-09-06)"
      - "offline supervision suite: cargo test -p reasonbraid-adapter --test claude_adapter (10 passed)"
    security_notes:
      - "run payload travels as the USER prompt only (after --; never system config/policy, §16.6)"
      - "the child runs --restricted --tools '' — no tools, no file writes, no WebFetch"
    upgrade_policy: >-
      revalidate the installed version and invocation mode on every CLI release;
      re-run the live qualification test before any release gate claims this adapter.
    revalidation_trigger: >-
      Claude Code CLI release or documented invocation-mode change; at each release gate
      that claims the Claude-family adapter.
    baseline: >-
      2026-09-04: Anthropic's former Claude Code SDK is now the Claude Agent SDK. Official
      first-party SDK documentation describes Python and TypeScript, so a Rust core must use
      a supervised sidecar/CLI or protocol boundary rather than assume a first-party Rust SDK.
      Anthropic also documents subscription-plan Agent SDK credit for eligible users, but
      billing/availability remains an external, revalidated fact (ROADMAP.md §28.1). Secondary
      sources: migration guide https://code.claude.com/docs/en/agent-sdk/migration-guide and
      plan-credit support article https://support.claude.com/en/articles/15036540-use-the-claude-agent-sdk-with-your-claude-plan.
      Revalidated 2026-09-06 at the second real adapter (PHASE-1.4): claude 2.1.263, the
      stream-json print interface pinned by three bounded live probes (evidence on-volume in
      target/claude-probes/), live-qualified by the env-gated claude_live suite.

  - name: "Workload-identity issuance stack (rcgen + rustls)"
    kind: "sdk"
    owner: "rcgen (RustCrypto-adjacent ecosystem) + Rustls project"
    source_url: "https://github.com/rustls/rcgen ; https://github.com/rustls/rustls"
    checked_at: "2026-09-07"   # NOT bumped: only the pinned versions were re-read (SIGNOFF-REPAIR.6.8.2.1)
    tested_versions:
      - "rcgen 0.14.10 (Cargo.lock)"
      - "rustls 0.23.45 (Cargo.lock)"   # SIGNOFF-REPAIR.6.8.2.1 — was 0.23.43; the lock this row cites had moved. A PATCH bump, so `upgrade_policy` below does not require the spike to re-run; both versions are vendored and carry the same licence
      - "rustls-pki-types 1.15.1 (Cargo.lock)"
      - "sha2 0.10.9, time 0.3.55 (spike auxiliaries)"
    protocol_versions:
      - "TLS 1.3 (the handshake the spike drives)"
    license: "Apache-2.0 OR MIT (rcgen, rustls, sha2, time) — verified by `make deny` (rc=0)"
    supported_features:
      - "project-local CA issuance; short-lived leaves with SAN; chain + validity verification; fingerprint gating"
    transports:
      - "in-memory spike: rustls over a loopback TCP socket (the .1.2 product use rides the axum HTTP channel)"
    auth_modes:
      - "mutual TLS with client-cert authentication (the spike's allowlist verifier models the node-id -> fingerprint status table)"
    known_semantic_losses: []
    conformance_results:
      - "PHASE-2.1.1 spike: cargo test -p reasonbraid-cert-spike -- --nocapture — 6/6 verdicts (trusted completes; foreign-CA, expired, and unregistered-fingerprint refused on both sides; rotation additive), issuance latency N=200 p50=63us p95=69us"
    security_notes:
      - "the CA key is held by the control plane at the Trusted LAN profile — re-evaluated before any non-LAN exposure (ADR-007's revisit trigger)"
      - "no OCSP/CRL distribution: revocation is the server-side status table + short expiry (10-minute leaves)"
      - "rcgen configured without its `pem` feature (DER only) — keeps base64 at a single version under the bans doctrine"
    upgrade_policy: >-
      pin by Cargo.lock; re-run the spike suite on any minor/major bump of rcgen or rustls
      and before the .1.2 channel upgrade lands.
    revalidation_trigger: >-
      rcgen/rustls release; before PHASE-2.1.2's CHANNEL_VERSION 3 lands; at each release
      gate that claims the certificate lifecycle.
    baseline: >-
      2026-09-07 (PHASE-2.1.1, ADR-007): the spike measured the project-local CA candidate
      against the §16.2 contract over a real TLS 1.3 client-cert handshake; step-ca and
      SPIFFE/SPIRE were evaluated on their published operational model, not installed
      (recorded asymmetry). The stack passes `make deny` (advisories/bans/licenses/sources ok).
